# LiveKit server for in-app consultation calls. Keys come from LIVEKIT_KEYS (docker-compose).
# Signalling (7880) is reached through Caddy at wss://rtc.<domain>. Caddy runs in Docker and connects through the
# Docker host gateway, so LiveKit must listen on all addresses (127.0.0.1 only refused Caddy). Keep 7880 closed
# in the firewall / AWS security group: only 22, 80, 443, 7881/TCP and 7882/UDP are open (docs/ops/livekit-on-vps.md).
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881                 # media fallback when UDP is blocked
  udp_port: 7882                 # single multiplexed UDP port for media
  use_external_ip: true          # finds the Elastic IP behind AWS NAT
room:
  # A room stays open 10 minutes after everyone left, so both people can rejoin the same room after a drop.
  empty_timeout: 600
  departure_timeout: 600
  max_participants: 4
logging:
  level: info
# Optional: built-in TURN for networks that block UDP and port 7881 (needs turn.<domain> DNS + certificate).
# turn:
#   enabled: true
#   domain: turn.astrorajnathjha.com
#   tls_port: 5349
